name: Build and Test WinOptiAI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Sync Python 3.11 environment
        run: uv sync --extra dev

      - name: Run automated test suite
        run: uv run pytest -v

      - name: Verify Inno Setup 6 availability
        run: Get-Command iscc | Select-Object -ExpandProperty Source

      - name: Build Portable & Setup executables
        run: uv run python scripts/build_exe.py

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WinOptiAI-Windows-x64
          path: |
            dist/WinOptiAI-Portable.exe
            dist/WinOptiAI-Setup.exe
            dist/SHA256SUMS.txt
